<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report the home indicator and notch
         (see --safe-* in src/styles.css). Fixed scale on phones: maximum-scale=1 stops iOS zooming in when a <16px input is
         focused. Desktop browsers ignore this tag, so Ctrl/Cmd +/- still works there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#15120f" />
    <title>GTO Hold'em</title>
    <script>
      // Apply the saved colour theme before first paint (see src/appTheme.ts).
      var t = 'lamplight'; try { t = localStorage.getItem('gto.theme') || t } catch (e) {}
      document.documentElement.dataset.theme = t
      // iOS ignores user-scalable=no for pinch, so block pinch on touch screens only.
      // Skipped on desktop so Safari trackpad pinch-zoom keeps working.
      if (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches) {
        document.addEventListener('gesturestart', function (e) { e.preventDefault() }, { passive: false })
      }
      // Home-screen web app on iOS/iPadOS (see --standalone-top-gap in src/styles.css).
      // navigator.standalone only exists on iOS WebKit; the display-mode check is a fallback.
      var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
      var homeScreen = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches
      if (ios && homeScreen) document.documentElement.classList.add('ios-home-screen')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
